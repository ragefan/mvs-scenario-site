<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MVS Scenario</title>
  <meta name="description" content="Step-by-step diagrams of a Neo Geo MVS MV1FZS: power-up to first sound, and power-up to the BIOS crosshatch, with fault injection and diagnosis." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314171a'/%3E%3Cpath d='M5 20h5l3-9 4 14 3-8 2 3h5' fill='none' stroke='%23ffb21e' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="./assets/index-Bp8FHhH2.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Zud1xu5N.css">
</head>
<body>
  <header class="bar" id="toolbar">
    <div class="brand">
      <span class="brand-name">MVS Scenario</span>
      <small id="board-name"></small>
    </div>
    <div class="seg" id="scenarios" role="group" aria-label="Scenario"></div>
    <div class="transport" role="group" aria-label="Step by step">
      <button class="tbtn" id="b-first" title="Start (origin)" aria-label="First step">⏮</button>
      <button class="tbtn" id="b-prev" title="Previous step (←)" aria-label="Previous step">◀</button>
      <div id="step-counter" class="counter" aria-live="polite"></div>
      <button class="tbtn" id="b-next" title="Next step (→)" aria-label="Next step">▶</button>
      <button class="tbtn" id="b-last" title="Last step (End)" aria-label="Last step">⏭</button>
      <button class="tbtn wide" id="b-play" aria-pressed="false" title="Auto-play (Space)">Play</button>
      <select id="speed" title="Playback speed" aria-label="Playback speed">
        <option value="4500">Slow</option>
        <option value="2600" selected>Normal</option>
        <option value="1300">Fast</option>
      </select>
    </div>
    <div id="fault-chip" class="fault-chip" hidden></div>
    <div class="seg" role="group" aria-label="Display">
      <button id="b-follow" aria-pressed="true" title="The camera follows the action (C)">Follow</button>
      <button id="b-timing" aria-pressed="false" title="Timing diagram of the step (T)">Timing</button>
      <button id="b-sound" aria-pressed="true" title="Play the first sound (S)">Sound</button>
    </div>
    <button class="tbtn wide" id="b-full" title="Fullscreen (F)">Fullscreen</button>
    <button class="tbtn" id="b-help" title="Help and shortcuts (?)" aria-label="Help">?</button>
  </header>

  <main id="main">
    <section id="stage" aria-label="Diagram">
      <div id="syn"></div>
      <div id="loading">Routing connections…</div>
      <div class="tools">
        <button class="tool" id="z-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="tool" id="z-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button class="tool" id="z-fit" title="Overview (double-click)" aria-label="Overview">⤢</button>
      </div>
      <div id="legend" class="legend"></div>
      <div id="banner" class="banner" hidden></div>
      <div id="sc-note" class="sc-note" hidden>No cartridge inserted: cartridge parts are greyed out</div>
      <div id="pkg-modal" class="modal" hidden></div>
      <div id="help" class="modal help" hidden></div>
    </section>
    <aside id="side">
      <div class="status">
        <div class="crt" aria-label="Monitor"><div id="screen"></div></div>
        <div class="status-txt">
          <div class="st-k">Monitor</div>
          <div id="screen-txt" class="st-v"></div>
          <div class="st-k">Speaker</div>
          <div id="speaker" class="st-v"></div>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="step">Step</button>
        <button role="tab" data-tab="fault">Faults</button>
        <button role="tab" data-tab="diag">Diagnosis</button>
        <button role="tab" data-tab="part">Part</button>
      </nav>
      <div id="panel" class="panel" role="tabpanel"></div>
    </aside>
  </main>

  <footer id="foot">
    <div id="timeline"></div>
    <div id="timing" hidden></div>
  </footer>
</body>
</html>
